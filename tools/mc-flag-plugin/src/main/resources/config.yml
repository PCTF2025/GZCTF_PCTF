# GZCTF 内部兑换接口
api-url: "http://127.0.0.1:8080/api/internal/flag"
# 与平台 InternalApiKey 一致
api-key: "change-me"
# 题目所属比赛与题目 ID
game-id: 1
challenge-id: 0

# 强制资源包开关（按周次启停，无需重启服务器）
# 第一周关闭，第二周用 /mcpack on 打开
resource-pack:
  enabled: false
  url: ""
  sha1: ""
  required: true

# 门卫：站在压力板上 + 主手拿着名字含 ops 的物品即可开闸
# 外侧压力板用于进门、内侧压力板用于出门；有人跨过闸门就立刻关上，
# 所以每次只放一个人通过。关门时恢复原始方块，不会变成基岩。
gate:
  enabled: false
  world: world
  radius: 2.0
  # 压力板被踩住不放时，最多开这么久（秒）
  max-open-seconds: 15
  # 外侧压力板（进门）
  outer:
    x: 0
    y: 64
    z: 0
  # 内侧压力板（出门）
  inner:
    x: 0
    y: 64
    z: 0
  # 闸门方块，靠原方块类型（如铁栏杆）自动恢复
  blocks:
    - "0,64,0"
  # 门卫室内部区域 x1,y1,z1,x2,y2,z2，用来判断「是否已跨过闸门」
  interior: "0,63.5,0,0,66.5,0"
