apiVersion: v1
kind: ServiceAccount
metadata:
  name: gzctf-traffic-collector
  namespace: gzctf
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gzctf-traffic-collector
  namespace: gzctf-challenges
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gzctf-traffic-collector
  namespace: gzctf-challenges
subjects:
  - kind: ServiceAccount
    name: gzctf-traffic-collector
    namespace: gzctf
roleRef:
  kind: Role
  name: gzctf-traffic-collector
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: gzctf-traffic-collector
  namespace: gzctf
spec:
  selector:
    matchLabels:
      app: gzctf-traffic-collector
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  template:
    metadata:
      labels:
        app: gzctf-traffic-collector
    spec:
      serviceAccountName: gzctf-traffic-collector
      hostPID: true
      terminationGracePeriodSeconds: 30
      containers:
        - name: collector
          image: YOUR_REGISTRY/gzctf-traffic-collector:latest
          securityContext:
            privileged: true
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: PLATFORM_URL
              value: http://gzctf.gzctf.svc.cluster.local:8080
            - name: CHALLENGE_NAMESPACE
              value: gzctf-challenges
            - name: GZCTF_INTERNAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: gzctf-internal-api
                  key: key
            - name: RUNTIME_ENDPOINT
              value: unix:///run/containerd/containerd.sock
            - name: SEGMENT_SECONDS
              value: "300"
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: spool
              mountPath: /var/lib/gzctf-traffic
            - name: runtime
              mountPath: /run/containerd/containerd.sock
      volumes:
        - name: spool
          hostPath:
            path: /var/lib/gzctf-traffic
            type: DirectoryOrCreate
        - name: runtime
          hostPath:
            path: /run/containerd/containerd.sock
            type: Socket
